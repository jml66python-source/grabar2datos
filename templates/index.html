<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar Datos</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0070f3; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0051a8; }
        #mensaje { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Registro de Datos</h2>
        <input type="text" id="dato1" placeholder="Escribe el Dato 1">
        <input type="text" id="dato2" placeholder="Escribe el Dato 2">
        <button onclick="guardarLocal()">Guardar Datos</button>
        <p id="mensaje"></p>
    </div>

    <script>
        function guardarLocal() {
            const d1 = document.getElementById('dato1').value;
            const d2 = document.getElementById('dato2').value;
            const msg = document.getElementById('mensaje');

            if (!d1 || !d2) {
                msg.innerText = "⚠️ Completa ambos campos";
                msg.style.color = "#e74c3c";
                return;
            }

            // Crear el contenido del archivo
            const texto = `Dato 1: ${d1}\nDato 2: ${d2}\n`;
            
            // Generar la descarga automática
            const blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
            const enlace = document.createElement("a");
            enlace.href = URL.createObjectURL(blob);
            enlace.download = "mis_datos.txt";
            enlace.click();
            URL.revokeObjectURL(enlace.href);

            msg.innerText = "✨ ¡Archivo descargado!";
            msg.style.color = "#2ecc71";
        }
    </script>
</body>
</html>
