<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Datos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input, button { padding: 10px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Añadir Registro</h2>
    <form method="POST">
        <input type="text" name="dato1" placeholder="Dato 1" required>
        <input type="text" name="dato2" placeholder="Dato 2" required>
        <button type="submit">Guardar en Historial</button>
    </form>

    <h2>Historial Guardado</h2>
    <table>
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>Dato 1</th>
                <th>Dato 2</th>
            </tr>
        </thead>
        <tbody>
            {% for reg in registros %}
            <tr>
                <td>{{ reg[0] }}</td>
                <td>{{ reg[1] }}</td>
                <td>{{ reg[2] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No hay registros aún.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
